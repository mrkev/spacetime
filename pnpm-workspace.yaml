packages:
  - 'packages/*'

minimumReleaseAge: 0

patchedDependencies:
  expo-calendar@58.0.6: patches/expo-calendar@58.0.6.patch
  react-native-maps@1.29.11: patches/react-native-maps@1.29.11.patch

# Both ship prebuilt binaries; their install scripts only build from source as a fallback.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

peerDependencyRules:
  allowedVersions:
    # react-native-worklets pulls in the latest @react-native/metro-config, but the community CLI
    # plugin pins its (optional) peer to its own exact version. Expo uses @expo/metro-config, not
    # the community CLI, so the mismatch doesn't matter.
    '@react-native/community-cli-plugin>@react-native/metro-config': '*'
